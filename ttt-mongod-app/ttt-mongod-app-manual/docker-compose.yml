services:
  mongodb:
    image: mongo:8.0
    container_name: tech613-adnan-mongodb-container
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    image: adnanh901/tech613-tttapp:1.2.0
    container_name: tech613-adnan-app-container
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/posts
    depends_on:
      - mongodb

volumes:
  mongo_data: